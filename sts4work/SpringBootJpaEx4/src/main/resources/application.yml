server:
  port: 8090
#mysql_setting
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rain?serverTimezone=Asia/Seoul
    username: taelim0619
    password: a1234
#jsp_setting
  mvc:
    view:
      prefix: /WEB-INF/
      suffix: .jsp
  devtools:
    livereload:
      enabled: true
#jpa_setting
#스키마생성 create:기존 테이블 삭제 후 생성, update:변경된 부분만 반영
  jpa:
    hibernate:
      ddl-auto: update
#ddl 생성시 데이터베이스의 고유기능을 사용할 것인가
    generate-ddl: true
#api 호출시 실행되는 sql문을 콘솔에 보여줄 것인가
    show-sql: true
#사용할 데이터베이스 종류
    database: mysql
#mysql 상세지정
    database-platform: org.hibernate.dialect.MySQLDialect