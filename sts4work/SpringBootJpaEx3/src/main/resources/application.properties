spring.application.name=SpringBootJpaEx3
server.port=9002
#jsp setting
spring.mvc.view.prefix=/WEB-INF/mycar/
spring.mvc.view.suffix=.jsp
spring.devtools.livereload.enabled=true
#mysql setting
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/rain?serverTimezone=Asia/Seoul
spring.datasource.username=taelim0619
spring.datasource.password=a1234
#jpa Setting
#스키마 생성 create:기존테이블 삭제후 생성, update:변경된 부분만 반영
spring.jpa.hibernate.ddl-auto=update
#ddl생성시 데이터베이스의 고유기능을 사용할것인가
spring.jpa.generate-ddl=true
#api 호출시 실행되는 sql문을 콘솔에 보여줄것인가
spring.jpa.show-sql=true
#사용할 데이터베이스 종류
spring.jpa.database=mysql
#mysql 상세지정
database-platform: org.hibernate.dialect.MySQLDialect