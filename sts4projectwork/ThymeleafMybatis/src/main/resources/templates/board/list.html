<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layoutMain}">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Black+Han+Sans&family=East+Sea+Dokdo&family=Gowun+Batang&family=Nanum+Myeongjo&family=Stylish&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<title>Insert title here</title>
</head>
<body>
<div layout:fragment="content">
  <h3>자동차 목록출력</h3>
  <h5>총 [[${totalcount}]]개의 자동차 정보가 있습니다</h5>
  <button type="button" class="btn btn-success"
  onclick="location.href='addform'">자동차 등록</button>
  
  <!-- 번호 자동차명 색상 가격 구입일 -->
  <table class="table table-bordered">
  <caption></caption>
  	<tr class="table-warning">
  		<th>번호</th>
  		<th>자동차명</th>
  		<th>색상</th>
  		<th>가격</th>
  		<th>구입일</th>
  	</tr>
  	<tbody>
  		<tr th:each="car, status : ${list}">
  			<td th:text="${status.index + 1}"></td>
  			<td><a th:text="${car.carname}" th:href="@{./detail(num=${car.num})}"></a></td>
  			<td th:text="${car.carcolor}"></td>
  			<td th:text="${car.carprice}"></td>
  			<td th:text="${car.guipday}"></td>
  		</tr>
  		
  	</tbody>
  </table>
</div>
</body>
</html>
