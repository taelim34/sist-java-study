<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layoutMain}">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Black+Han+Sans&family=East+Sea+Dokdo&family=Gowun+Batang&family=Nanum+Myeongjo&family=Stylish&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<title>Insert title here</title>
<script type="text/javascript" th:inline="javascript">
$(function(){
	
	//처음시작시 댓글출력
	comment_list();
	
	
	//insert
	$("#btncommentsend").click(function(){
		
		let num=$("#comment").attr("data-num");
		let comment=$("#comment").val();
	
		
		$.ajax({
			type:"get",
			url:"addcomment",
			dataType:"html",
			data:{"comment":comment,"num":num},
			success:function(){
				//alert("댓글 입력성공");
				$("#comment").val("");
				comment_list();
			}
		});
	});
	
});

function comment_list()
{
	let num=$("#comment").attr("data-num");
	
	$.ajax({
		type:"get",
		url:"commentlist",
		dataType:"json",
		data:{"num":num},
		success:function(res){			
			let s="";
			$.each(res, function(i,item){
				
				s+="<h6>";
				s+=item.comment;
				s+="</h6>";
			});
			
			$("div.comment-list").html(s);
		}
	});
}
</script>
</head>
<body>
<div layout:fragment="content">
  <h1>TymeLeaf 메인페이지 입니다</h1>
  <table class="table table-bordered">
  	<tr>
  		<td>
  			자동차명: [[${dto.carname}]]<br>
  			<img alt="" th:src="@{/carsave/{photo}(photo=${dto.carphoto})}" style="width: 300px;"><br>
  			
  			<!-- 댓글 -->
  			<h5>댓글</h5>
  			<div class="comment-list">
  				댓글리스트
  			</div>
  			<br>
  			<div class="input-group" style="width: 350px;">
  				<input type="text" class="form-control" id="comment"
  				style="width: 250px;" th:data-num="${dto.num}">
  				<button type="button" class="btn btn-success"
  				id="btncommentsend">저장</button>
  			</div>
  			
  			<button type="button" class="btn btn-info" onclick="location.href='list'">목록</button>
  			<button type="button" class="btn btn-info" th:onclick="|location.href='@{carupdate(num=${dto.num})}'|">수정</button>
  			<button type="button" class="btn btn-info" th:onclick="|location.href='@{delete(num=${dto.num})}'|">삭제</button>
  		</td>
  	</tr>
  </table>
</div>
</body>
</html>
