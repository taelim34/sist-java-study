<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layoutMain}">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Black+Han+Sans&family=East+Sea+Dokdo&family=Gowun+Batang&family=Nanum+Myeongjo&family=Stylish&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<title>Insert title here</title>
</head>
<body>
<div layout:fragment="content">
<form action="insert" method="post" enctype="multipart/form-data">
	<table class="table table-bordered" style="width: 600px;">
	<caption align="top"><b>추가폼</b></caption>
		<tr>
			<th>이름</th>
			<td>
				<input type="text" class="form-control" name="sangpum">
			</td>
		</tr>
		<tr>
			<th>가격</th>
			<td>
				<input type="text" class="form-control" name="price">
			</td>
		</tr>
		<tr>
			<th>입고일</th>
			<td>
				<input type="date" class="form-control" name="ipgoday">
			</td>
		</tr>
		<tr>
			<th>사진</th>
			<td>
				<input type="file" class="form-control" name="upload">
			</td>
		</tr>
		<tr>
			<td colspan="2" align="center">
				<button type="submit" class="btn btn-danger">추가</button>
				<button type="button" class="btn btn-info"
				onclick="location.href='list'">목록</button>
			</td>
		</tr>
	</table>
</form>
</div>
</body>
</html>
