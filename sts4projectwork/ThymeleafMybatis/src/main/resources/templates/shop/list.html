<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layoutMain}">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Black+Han+Sans&family=East+Sea+Dokdo&family=Gowun+Batang&family=Nanum+Myeongjo&family=Stylish&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<title>Insert title here</title>
</head>
<body>
<div layout:fragment="content">
  <h1>숍리스트 입니다</h1>
  <h1>총 [[${count}]]개의 정보가 있습니다</h1>
  <!-- <img alt="" src="/image2/main3.png"> -->
  <img alt="" th:src="@{/image2/main3.png}">
  <button type="button" class="btn btn-outline-success" onclick="location.href='form'">추가하기</button>
  <table class="table table-bordered">
  	<thead>
	  	<tr>
	  		<th>번호</th>
	  		<th>사진</th>
	  		<th>가격</th>
	  		<th>색상</th>
	  		<th>입고일</th>
	  		<th>작성일</th>
	  	</tr>
  	</thead>
  	<tbody>
  		<tr th:each="shop, status : ${list}">
  			<td th:text="${status.index + 1}"></td>
  			<td><a th:text="${shop.sangpum}" href=""></a></td>
  			<td th:text="${shop.photo}"></td>
  			<td th:text="${shop.price}"></td>
  			<td th:text="${shop.ipgoday}"></td>
  			<td th:text="${shop.writeday}"></td>
  		</tr>
  	</tbody>
  </table>
</div>
</body>
</html>
